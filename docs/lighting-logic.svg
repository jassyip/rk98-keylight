<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 840" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif">
  <title>RK98 键盘亮灯逻辑（分区模式）</title>
  <desc>颜色=来源，模式=状态；主键区 6 排为任务槽，numpad 为溢出区</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="840" fill="#FFFFFF"/>

  <!-- ============ 头部 ============ -->
  <text x="24" y="36" font-size="25" font-weight="700" fill="#1F2430">RK98 键盘亮灯逻辑</text>
  <text x="24" y="60" font-size="13.5" fill="#5A6472">分区模式（M4）：每个任务独占一排 · 颜色区分来源 · 模式区分状态 · 协议层零改动</text>

  <!-- ============ ① 编码规则 ============ -->
  <rect x="20" y="76" width="940" height="176" rx="10" fill="#FBFCFD" stroke="#E5E8EC"/>
  <text x="40" y="102" font-size="15" font-weight="700" fill="#1F2430">① 编码规则：颜色 = 来源，模式 = 状态</text>
  <text x="40" y="120" font-size="11" fill="#8A93A0">新增一个 agent 来源只需加一种颜色；状态语义全键盘通用</text>

  <text x="325" y="140" font-size="12.5" font-weight="700" fill="#5A6472" text-anchor="middle">运行中</text>
  <text x="505" y="140" font-size="12.5" font-weight="700" fill="#5A6472" text-anchor="middle">待确认</text>
  <text x="685" y="140" font-size="12.5" font-weight="700" fill="#5A6472" text-anchor="middle">完成</text>

  <text x="48" y="158" font-size="13" font-weight="700" fill="#1F2430">Codex</text>
  <text x="48" y="172" font-size="10.5" fill="#8A93A0">外部 CLI</text>
  <text x="48" y="206" font-size="13" font-weight="700" fill="#1F2430">WorkBuddy</text>
  <text x="48" y="220" font-size="10.5" fill="#8A93A0">本对话</text>

