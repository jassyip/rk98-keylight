  <text x="640" y="588" font-size="12" font-weight="700" fill="#1F2430" text-anchor="middle">帧合成</text>
  <text x="640" y="603" font-size="10.5" fill="#8A93A0" text-anchor="middle">100 键 RGB</text>

  <line x1="700" y1="592" x2="728" y2="592" stroke="#8A93A0" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="730" y="568" width="150" height="48" rx="7" fill="#FFFFFF" stroke="#D4D9E0"/>
  <text x="805" y="588" font-size="12" font-weight="700" fill="#1F2430" text-anchor="middle">RK98 键盘</text>
  <text x="805" y="603" font-size="10.5" fill="#8A93A0" text-anchor="middle">Feature 报表 ×8/帧</text>

  <text x="40" y="656" font-size="11.5" fill="#5A6472">两个来源的事件归一化成同一套信号，共用槽位系统；没有任何 运行中 / 等待中 / 完成闪 任务时立即停流，键盘自动回自带灯效（点击扩散）</text>

