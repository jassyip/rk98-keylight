  <text x="700" y="462" font-size="11" font-weight="700" fill="#2979FF">← Codex 溢出</text>
  <text x="804" y="462" font-size="11" font-weight="700" fill="#00B34A" text-anchor="end">WorkBuddy 溢出 →</text>
  <text x="700" y="478" font-size="10.5" fill="#8A93A0">颗数 = 溢出任务数（图中示例 3 / 2）</text>

  <text x="40" y="500" font-size="11.5" fill="#5A6472">每排独占一个任务：先到先得，存活期间不换排（无视觉跳动）；超过 6 个任务时按来源进入对应半区；无溢出时 numpad 全暗</text>

